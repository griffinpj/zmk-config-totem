# set custom keyboard name
CONFIG_ZMK_KEYBOARD_NAME="Totem"

# enable experimental ble features
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# BLUETOOTH CONNECTION STABILITY FIXES
# Use balanced power instead of max power for stability
CONFIG_BT_CTLR_TX_PWR_0=y
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Optimize Bluetooth connection intervals for ultra-low latency
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=200

# Improve split keyboard connection stability
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# DEEP SLEEP AND SPLIT WAKE-UP FIXES
# Increase sleep timeout to 60min for better split coordination
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Split keyboard specific sleep settings
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=2048
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=20

# Enable split peripheral sleep coordination
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=2048

# Connection retry settings for better split reliability
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_BUF_ACL_TX_SIZE=69

# AGGRESSIVE LATENCY OPTIMIZATIONS
# "Eager Debouncing" - Trying to lower the input lag.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Matrix scanning optimizations for ultra-low latency
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=0
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=0

# Disable power management features that introduce delays
CONFIG_PM_DEVICE_RUNTIME=n
CONFIG_ZMK_PM_SOFT_OFF=n
CONFIG_PM_POLICY_DEFAULT=n

# Optimize HID reporting for responsiveness
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y

# Battery reporting (keep existing)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_USB_LOGGING=n
