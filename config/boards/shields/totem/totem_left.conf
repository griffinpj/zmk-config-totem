CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Enhanced central wake-up responsiveness
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=20
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=20

# Power management disabled globally for maximum responsiveness
# CONFIG_PM_DEVICE=y